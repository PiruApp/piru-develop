spring.application.name=piru-backend
server.port=${PORT:8080}

# Orígenes permitidos para el frontend (separados por coma)
piru.cors.origenes=${PIRU_CORS_ORIGENES:http://localhost:3000}

# Cotización del dólar (DolarAPI, gratuita y sin clave)
piru.cotizacion.url=https://dolarapi.com
piru.cotizacion.timeout-ms=3000
piru.cotizacion.cache-minutos=10
# Se usa solo si DolarAPI no responde y no hay valor previo; la respuesta queda marcada como respaldo.
piru.cotizacion.venta-respaldo=${PIRU_COTIZACION_RESPALDO:1500}

# Clave compartida con el BFF de Next.js (frontend/.env.local -> PIRU_BFF_CLAVE). Cambiarla fuera de desarrollo.
piru.bff.clave=${PIRU_BFF_CLAVE:clave-local-de-desarrollo-cambiar}
# Ofertas de prestadores de ejemplo
piru.semilla.ofertas=${PIRU_SEMILLA_OFERTAS:true}
